name: Verify and deploy installer

on:
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'scripts/generate-release-manifest.py'
      - 'scripts/build-linux-package.py'
      - 'scripts/build-rpm.py'
      - 'scripts/tests/**'
      - 'packaging/cloudflare/**'
      - '.github/workflows/installer.yml'
      - '.github/workflows/release.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/install.sh'
      - 'scripts/generate-release-manifest.py'
      - 'scripts/build-linux-package.py'
      - 'scripts/build-rpm.py'
      - 'scripts/tests/**'
      - 'packaging/cloudflare/**'
      - '.github/workflows/installer.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify installer scripts and packaging helpers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax and ShellCheck
        run: |
          bash -n scripts/install.sh
          shellcheck scripts/install.sh
      - name: Check Python syntax and installer test suite
        run: |
          python3 -m py_compile \
            scripts/generate-release-manifest.py \
            scripts/build-linux-package.py \
            scripts/build-rpm.py
          python3 -m unittest discover -s scripts/tests -v

  deploy:
    name: Deploy gds.gandesktop.dev/install.sh
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: cloudflare-installer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync install.sh to Cloudflare Workers Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z ${CLOUDFLARE_API_TOKEN:-} ]]; then
            echo 'CLOUDFLARE_API_TOKEN is not set; skipping Cloudflare installer deployment.'
            exit 0
          fi
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID repository variable}"
          npm ci --prefix packaging/cloudflare
          npm run deploy --prefix packaging/cloudflare
          curl --fail --show-error --silent --head https://gds.gandesktop.dev/install.sh >/dev/null
