[package]
name = "gds"
version = "0.0.2"
edition = "2024"
autobins = false
publish = false
license = "Apache-2.0"
authors = ["4t145"]
homepage = "https://github.com/GanDesktop/gds"
repository = "https://github.com/GanDesktop/gds"

[package.metadata.gds.about]
feedback = "https://github.com/GanDesktop/gds/issues"
license-file = "LICENSE"
credits = [
    { name = "GPUI", website = "https://github.com/zed-industries/zed" },
    { name = "gpui-kit", website = "https://github.com/longbridge/gpui-kit" },
    { name = "gds-uim", website = "https://github.com/GanDesktop/gds-uim" },
]

[package.metadata.gds.about.applications.gds-files]
name = "GDS Files"
icon = "assets/files/icon-solid.svg"

[package.metadata.gds.about.applications.gds-agents]
name = "GDS Agents"
icon = "assets/agents/icon-solid.svg"

[workspace]
members = ["macros/gds-settings-derive"]
resolver = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gds-files"
path = "bin/files/src/main.rs"
required-features = ["files"]

[[bin]]
name = "gds-agents"
path = "bin/agents/src/main.rs"
required-features = ["agents"]

[[bin]]
name = "xdg-desktop-portal-gds"
path = "bin/portal/src/main.rs"
required-features = ["portal"]

[[bin]]
name = "gds-nixes"
path = "bin/nixes/src/main.rs"
required-features = ["nixes"]

[features]
# Capability features. Dependencies are declared once in the group of the
# capability that owns them; every feature enables the packages its own code
# uses directly.
default = []
app = ["task-manager", "dep:gpui-kit", "dep:tracing"]
task-manager = ["dep:tokio", "dep:tokio-util", "dep:thiserror", "dep:nix"]
desktop-protocol = ["dep:serde"]
persistence = ["dep:thiserror", "dep:tempfile", "dep:nix"]
watch = ["dep:notify", "dep:tokio", "dep:tracing"]
desktop = [
    "desktop-protocol", "watch", "dep:tokio", "dep:tracing", "dep:infer",
    "dep:open", "dep:thiserror", "dep:url", "dep:ashpd", "dep:zbus",
    "dep:rustix",
]
file-tags = ["desktop", "dep:rustix"]
storage = [
    "task-manager",
    "dep:toasty", "dep:toasty-driver-sqlite", "dep:toasty-core",
    "dep:tokio", "dep:thiserror", "dep:nix",
]
logs = ["dep:tokio", "dep:tracing", "dep:tracing-subscriber", "dep:thiserror"]
terminal = [
    "task-manager",
    "dep:tokio", "dep:anyhow", "dep:portable-pty", "dep:alacritty_terminal",
    "dep:thiserror", "dep:nix",
]
file-inspection = [
    "task-manager",
    "dep:lofty",
    "dep:tracing", "dep:directories", "dep:image", "dep:png", "dep:resvg",
    "dep:thiserror", "dep:tempfile", "dep:url", "dep:md-5",
]
remote = [
    "persistence", "dep:tokio", "dep:anyhow", "dep:futures-lite", "dep:russh",
    "dep:russh-sftp", "dep:smb", "dep:serde", "dep:thiserror", "dep:url",
    "dep:percent-encoding",
]
appearance = [
    "app", "task-manager",
    "watch", "dep:gpui-kit", "dep:font-kit", "dep:directories", "dep:tracing",
    "dep:serde", "dep:serde_json", "dep:thiserror", "dep:toml", "dep:rust-ini",
    "dep:zbus", "dep:futures-lite",
]
i18n = ["dep:fluent-bundle", "dep:fluent-syntax", "dep:gpui-kit", "dep:serde", "dep:thiserror", "dep:unic-langid"]
ui = [
    "app",
    "appearance", "i18n", "persistence", "logs", "terminal", "file-inspection",
    "dep:gds-settings-derive", "dep:gds-uim", "dep:gpui", "dep:anyhow",
    "dep:unicode-segmentation", "dep:unicode-width", "dep:chrono", "dep:serde_json",
    "dep:rust-embed",
]
files = [
    "ui", "desktop", "file-tags", "storage", "remote", "dep:clap", "dep:globset",
    "dep:mime_guess", "dep:xdg-mime", "dep:trash", "dep:tokio-util", "dep:walkdir",
]
agents = [
    "ui", "desktop", "storage", "dep:clap", "dep:tokio-util", "dep:mime_guess",
    "dep:bas", "dep:base64", "dep:jiff",
    "dep:reqwest_client", "dep:vt100",
    "dep:similar", "dep:markdown", "dep:html5ever",
    "dep:markup5ever_rcdom", "dep:rodio", "dep:futures",
    "dep:tokio-stream", "dep:tonic",
    "dep:uuid", "dep:sha2", "dep:rustls",
    "gpui-kit/tree-sitter-markdown", "gpui-kit/tree-sitter-rust",
    "gpui-kit/tree-sitter-bash", "gpui-kit/tree-sitter-python",
    "gpui-kit/tree-sitter-typescript", "gpui-kit/tree-sitter-diff",
    "dep:arboard", "dep:dirs", "dep:which",
    "dep:strum", "dep:time", "dep:agent-client-protocol",
    "dep:process-wrap",
]
nixes = ["ui", "dep:clap", "dep:tokio", "dep:serde", "dep:serde_json", "dep:anyhow"]
portal = [
    "desktop-protocol", "dep:anyhow", "dep:tokio", "dep:clap", "dep:nix",
    "dep:serde_json", "dep:thiserror", "dep:url", "dep:zbus",
]
gui-tests = ["files", "agents", "gpui-kit/test-support", "zbus?/p2p"]
files-e2e = ["files", "gpui-kit/test-support", "dep:futures"]

[dependencies]
# Async runtime, errors and serialization shared by several capabilities.
tokio = { version = "1", optional = true, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", features = ["net", "sync"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
futures = { version = "0.3", optional = true }
futures-lite = { version = "2", optional = true }
anyhow = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
toml = { version = "0.9", optional = true }
url = { version = "2", features = ["serde"], optional = true }
percent-encoding = { version = "2", optional = true }
directories = { version = "6", optional = true }
tempfile = { version = "3", optional = true }
walkdir = { version = "2.5", optional = true }

# Data, text and time formats used by the service and UI code.
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
uuid = { version = "1", features = ["serde", "v4"], optional = true }
strum = { version = "0.28", features = ["derive"], optional = true }
similar = { version = "2", optional = true }
time = { version = "0.3", features = ["parsing"], optional = true }
chrono = { version = "0.4", optional = true }
jiff = { version = "0.2", optional = true }
markdown = { version = "=1.0.0", optional = true }
html5ever = { version = "=0.27.0", optional = true }
markup5ever_rcdom = { version = "=0.3.0", optional = true }

# Desktop integration and filesystem watching.
notify = { version = "8", optional = true }
open = { version = "5", optional = true }
infer = { version = "0.19", default-features = false, optional = true }

# Persistence and SQLite storage.
toasty = { version = "=0.11.0", features = ["sqlite", "migration", "serde"], optional = true }
toasty-driver-sqlite = { version = "=0.11.0", optional = true }
toasty-core = { version = "=0.11.0", optional = true }

# Terminal backend.
# Published MIT PTY transport and Apache-2.0 terminal emulator; no GPUI forks.
portable-pty = { version = "=0.9.0", optional = true }
alacritty_terminal = { version = "=0.26.0", optional = true }

# Audio metadata and embedded artwork.
lofty = { version = "0.25", optional = true }

# Thumbnail rendering.
# Thumbnail filenames and PNG metadata use already locked libraries.
md-5 = { version = "=0.10.6", optional = true }
png = { version = "=0.18.1", optional = true }
resvg = { version = "=0.46.0", optional = true }
# Header-only dimension/colour probing needs these decoders; every feature here
# is already enabled by GPUI, so the resolved dependency set does not change.
image = { version = "0.25.10", optional = true, default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }

# Remote filesystems.
russh = { version = "=0.65.0", default-features = false, features = ["ring", "rsa"], optional = true }
russh-sftp = { version = "=3.0.1", optional = true }
# Later SMB releases pin RustCrypto prereleases incompatible with current russh.
smb = { version = "=0.10.2", default-features = false, features = ["async", "sign", "encrypt", "std-fs-impls"], optional = true }

# Appearance and i18n.
# Same MIT/Apache font discovery library as GPUI; resolve system UI and monospace aliases.
font-kit = { package = "zed-font-kit", version = "=0.14.1-zed", optional = true }
gpui-kit = { version = "=0.9.0", optional = true, features = ["gpui-fast"] }
rust-ini = { version = "0.21", features = ["brackets-in-section-names"], optional = true }
fluent-bundle = { version = "0.16", optional = true }
fluent-syntax = { version = "0.12", optional = true }
unic-langid = { version = "0.9", optional = true }

# Shared UI.
gpui = { package = "gpui-fast", version = "=0.1.13", optional = true }
gds-uim = { git = "https://github.com/GanDesktop/gds-uim", rev = "90f5424edf6ba9c5ffaacc2b11cb5ffe24960519", optional = true }
gds-settings-derive = { path = "macros/gds-settings-derive", optional = true }
# Kit's RustEmbed sources must stay self-contained in installed dev builds too.
rust-embed = { version = "8", optional = true, features = ["debug-embed"] }
unicode-segmentation = { version = "1", optional = true }
unicode-width = { version = "0.2", optional = true }

# Files application.
# The picker matches raw (possibly non-UTF-8) basenames, so globbing is done on
# `Path` values instead of hand-rolled `String` matching.
globset = { version = "0.4", optional = true }
mime_guess = { version = "2", optional = true }
xdg-mime = { version = "0.4", optional = true }
trash = { version = "5.3.0", optional = true }

# Agents application.
agent-client-protocol = { version = "=3.3.0", features = ["unstable", "unstable_protocol_v2"], optional = true }
bas = { package = "bas-client", git = "https://github.com/GanDesktop/bas", branch = "main", features = ["workspace-schema"], optional = true }
dirs = { version = "6", optional = true }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.11", optional = true }
rodio = { version = "=0.21.1", optional = true, default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav", "tracing"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tonic = { version = "0.14", features = ["tls-ring"], optional = true }
vt100 = { version = "0.16", optional = true }
which = { version = "8", optional = true }

# Command-line entry points (Files, Agents and Portal).
clap = { version = "4", features = ["derive", "env"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "open_uri"], optional = true }
zbus = { version = "5.19", default-features = false, features = ["tokio"], optional = true }
rustix = { version = "1.1", features = ["fs", "event"], optional = true }

[target.'cfg(unix)'.dependencies]
# Owner/group names come from the system NSS interfaces (`getpwuid_r` /
# `getgrgid_r`); we do not parse passwd files ourselves.
nix = { version = "0.31", features = ["user", "fs", "process", "signal"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "=3.6.1", optional = true }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"], optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9" }

[dev-dependencies]
futures-lite = "2"
regex = "1"
serde_json = "1"
tempfile = "3"
bas = { package = "bas-client", git = "https://github.com/GanDesktop/bas", branch = "main" }
bas-server = { git = "https://github.com/GanDesktop/bas", branch = "main" }
# Runtime-generated TLS fixtures for the imported connection tests.
rcgen = "=0.13.2"
tonic-prost = "0.14"

[target.'cfg(unix)'.dev-dependencies]
# Test-only PTY helpers (`nix::pty`, `nix::unistd::tcsetpgrp`) in the Agents
# terminal tests; production code does not need nix's term feature.
nix = { version = "0.31", features = ["process", "term"] }

[profile.dev]
debug = 1

# Use standard release optimization while keeping compilation parallel.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = 0
strip = "symbols"
incremental = false

[patch.crates-io]
gpui-component = { git = "https://github.com/GanDesktop/gpui-kit", branch = "gds-0.9.0" }
gpui-fast = { git = "https://github.com/GanDesktop/gpui-fast", branch = "gds-0.1.13" }
gpui-fast-linux = { git = "https://github.com/GanDesktop/gpui-fast-linux", rev = "2270030d3e0cf75def11e44e5cc0f6c9991fae49" }
