[package]
name = "gds"
version = "0.0.5"
edition = "2024"
rust-version = "1.100"
autobins = false
publish = false
license = "Apache-2.0"
authors = ["4t145"]
homepage = "https://github.com/GanDesktop/gds"
repository = "https://github.com/GanDesktop/gds"

[package.metadata.gds.about]
feedback = "https://github.com/GanDesktop/gds/issues"
license-file = "LICENSE"
credits = [
    { name = "zgui", website = "https://github.com/zortax/zgui" },
]

[package.metadata.gds.about.applications.gds-files]
name = "GDS Files"
icon = "assets/files/icon-solid.svg"

[workspace]
members = ["macros/gds-settings-derive"]
resolver = "3"

[workspace.lints.cargo]
# build.rs 通过 CARGO_PKG_HOMEPAGE 注入应用主页链接，现阶段与仓库地址相同
redundant_homepage = "allow"
# build-dependencies (serde, toml) are only active when feature `ui` compiles metadata checks in build.rs
unused_dependencies = "allow"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
# 代码组织：禁止采用 mod.rs 组织方式（agents.md §子模块）
mod_module_files = "deny"
# 错误处理：禁止裸 unwrap()，使用 expect("reason") 替代（agents.md §错误处理）
unwrap_used = "deny"
# 错误处理：禁止用 `let _ =` 静默丢弃未 await 的 Future（agents.md §错误处理）
let_underscore_future = "deny"
# 错误处理：返回错误的公开函数在文档中提供 `# Errors` 说明（agents.md §错误处理）
missing_errors_doc = "warn"
# 测试与清理：禁止在代码中残留一次性调试宏与未完成占位符（agents.md §测试）
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# 库函数优先：字符串前后缀优先使用 strip_prefix / strip_suffix（agents.md §相信经过验证的代码）
manual_strip = "deny"
# 控制流：使用 Rust 2024 的 `let ... else` 减少嵌套（agents.md §异步与控制流）
manual_let_else = "warn"
# 项目规范对齐豁免：
# 1) 组件默认统一通过 `Default::default` 创建，包括无字段单元组件（agents.md §技术栈）
default_constructed_unit_structs = "allow"
# 2) 桌面/远程服务错误与会话枚举按设计保留双端完整底层错误与连接上下文（docs/development.md）
result_large_err = "allow"
large_enum_variant = "allow"
# 3) `#[tokio::test]` 宏在测试中展开 Builder 调用；生产目标由 `just lint` 单独开启 `-D clippy::disallowed_methods`
disallowed_methods = "allow"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "gds-files"
path = "bin/files/src/main.rs"
required-features = ["files"]

[[bin]]
name = "xdg-desktop-portal-gds"
path = "bin/portal/src/main.rs"
required-features = ["portal"]

[features]
# Capability features. Dependencies are declared once in the group of the
# capability that owns them; every feature enables the packages its own code
# uses directly.
default = []
app = ["task-manager", "dep:zgui", "dep:zgui-ui-tokens", "dep:tracing"]
task-manager = ["dep:tokio", "dep:tokio-util", "dep:thiserror", "dep:nix"]
desktop-protocol = ["dep:serde"]
persistence = ["dep:thiserror", "dep:tempfile", "dep:nix"]
watch = ["dep:notify", "dep:tokio", "dep:tracing"]
desktop = [
    "desktop-protocol", "watch", "dep:tokio", "dep:tracing", "dep:infer",
    "dep:open", "dep:thiserror", "dep:url", "dep:ashpd", "dep:zbus",
    "dep:rustix", "dep:chrono", "dep:directories", "dep:percent-encoding",
    "dep:roxmltree", "dep:tempfile",
]
file-tags = ["desktop", "dep:rustix"]
storage = [
    "task-manager",
    "dep:toasty", "dep:toasty-driver-sqlite", "dep:toasty-core",
    "dep:tokio", "dep:thiserror", "dep:nix",
]
logs = ["dep:tokio", "dep:tracing", "dep:tracing-subscriber", "dep:thiserror"]
terminal = [
    "task-manager",
    "dep:tokio", "dep:anyhow", "dep:portable-pty", "dep:alacritty_terminal",
    "dep:thiserror", "dep:nix",
]
file-inspection = [
    "task-manager",
    "dep:lofty", "dep:mp4-atom",
    "dep:tracing", "dep:directories", "dep:image", "dep:png", "dep:resvg",
    "dep:thiserror", "dep:tempfile", "dep:url", "dep:md-5",
]
remote = [
    "persistence", "dep:tokio", "dep:anyhow", "dep:futures-lite", "dep:russh",
    "dep:russh-sftp", "dep:smb", "dep:serde", "dep:thiserror", "dep:url",
    "dep:percent-encoding", "dep:oo7", "dep:zbus", "dep:tracing",
]
appearance = [
    "app", "persistence", "task-manager",
    "watch", "dep:zgui", "dep:zgui-ui-tokens", "dep:color", "dep:fontconfig-sys", "dep:directories", "dep:tracing",
    "dep:serde", "dep:serde_json", "dep:thiserror", "dep:toml", "dep:rust-ini",
    "dep:zbus", "dep:futures-lite",
]
i18n = ["dep:fluent-bundle", "dep:fluent-syntax", "dep:serde", "dep:thiserror", "dep:unic-langid"]
ui = [
    "app",
    "appearance", "i18n", "persistence", "logs", "terminal", "file-inspection",
    "dep:zgui", "dep:zgui-ui", "dep:zgui-ui-tokens", "dep:zgui-ui-primitives", "dep:zgui-ui-icons",
    "dep:zgui-image",
    "dep:gds-settings-derive", "dep:anyhow",
    "dep:unicode-segmentation", "dep:unicode-width", "dep:chrono", "dep:serde_json",
    "dep:rust-embed",
]
files = [
    "ui", "desktop", "file-tags", "storage", "remote", "dep:clap", "dep:globset",
    "dep:memmap2", "dep:mime_guess", "dep:nix", "dep:roxmltree", "dep:xdg-mime", "dep:trash",
    "dep:tokio-util", "dep:walkdir", "dep:which",
]
image-engine = [
    "file-tags",
    "dep:crc32fast",
    "dep:flate2",
    "dep:image",
    "dep:moxcms",
    "dep:nix",
    "dep:png",
    "dep:resvg",
    "dep:rustix",
    "dep:tempfile",
    "dep:thiserror",
    "dep:tokio-util",
    "dep:tracing",
]
portal = [
    "desktop-protocol", "dep:anyhow", "dep:tokio", "dep:clap", "dep:nix",
    "dep:serde_json", "dep:thiserror", "dep:url", "dep:zbus",
]
gui-tests = ["files", "dep:zgui-platform-headless", "zbus?/p2p"]
files-e2e = [
    "files",
    "dep:futures",
    "dep:zgui-platform-headless",
    "dep:zgui-render-wgpu",
    "dep:zgui-render-vector-vello",
]

[dependencies]
# Async runtime, errors and serialization shared by several capabilities.
tokio = { version = "1", optional = true, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", features = ["net", "sync"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
futures = { version = "0.3", optional = true }
futures-lite = { version = "2", optional = true }
anyhow = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
toml = { version = "0.9", optional = true }
url = { version = "2", features = ["serde"], optional = true }
percent-encoding = { version = "2", optional = true }
directories = { version = "6", optional = true }
tempfile = { version = "3", optional = true }
walkdir = { version = "2.5", optional = true }

# Data, text and time formats used by the service and UI code.
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
uuid = { version = "1", features = ["serde", "v4"], optional = true }
strum = { version = "0.28", features = ["derive"], optional = true }
similar = { version = "2", optional = true }
time = { version = "0.3", features = ["parsing"], optional = true }
chrono = { version = "0.4", optional = true }
jiff = { version = "0.2", optional = true }
markdown = { version = "=1.0.0", optional = true }
html5ever = { version = "=0.27.0", optional = true }
markup5ever_rcdom = { version = "=0.3.0", optional = true }

# Desktop integration and filesystem watching.
notify = { git = "https://github.com/GanDesktop/notify", branch = "gds-8.2.0", optional = true }
open = { version = "5", optional = true }
infer = { version = "0.19", default-features = false, optional = true }

# Persistence and SQLite storage.
toasty = { version = "=0.11.0", features = ["sqlite", "migration", "serde"], optional = true }
toasty-driver-sqlite = { version = "=0.11.0", optional = true }
toasty-core = { version = "=0.11.0", optional = true }

# Terminal backend.
# Published MIT PTY transport and Apache-2.0 terminal emulator.
portable-pty = { version = "=0.9.0", optional = true }
alacritty_terminal = { version = "=0.26.0", optional = true }

# Audio and ISO-BMFF container metadata.
lofty = { version = "0.25", optional = true }
mp4-atom = { version = "0.17", optional = true }

# Thumbnail rendering and image engine.
# Thumbnail filenames, gzip/PNG CRC, and PNG metadata use already locked libraries.
crc32fast = { version = "1.5", optional = true }
flate2 = { version = "1.1", optional = true }
md-5 = { version = "=0.10.6", optional = true }
png = { version = "=0.18.1", optional = true }
resvg = { version = "=0.46.0", optional = true }
# Header-only dimension/colour probing needs these decoders; every feature here
# matches the decoders already enabled by `zgui-image`.
image = { version = "0.25.10", optional = true, default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
moxcms = { version = "0.8.1", features = ["in_place"], optional = true }

# Remote filesystems.
russh = { version = "=0.65.0", default-features = false, features = ["ring", "rsa"], optional = true }
russh-sftp = { version = "=3.0.1", optional = true }
# Later SMB releases pin RustCrypto prereleases incompatible with current russh.
smb = { version = "=0.10.2", default-features = false, features = ["async", "sign", "encrypt", "std-fs-impls"], optional = true }

# Appearance and i18n.
color = { version = "0.3", optional = true }
rust-ini = { version = "0.21", features = ["brackets-in-section-names"], optional = true }
fluent-bundle = { version = "0.16", optional = true }
fluent-syntax = { version = "0.12", optional = true }
unic-langid = { version = "0.9", features = ["likelysubtags"], optional = true }

# Shared UI.
zgui = { git = "https://github.com/GanDesktop/zgui", branch = "gds-0.1.0", features = ["tokio"], optional = true }
zgui-ui = { git = "https://github.com/GanDesktop/zgui", branch = "gds-0.1.0", optional = true }
zgui-ui-tokens = { git = "https://github.com/GanDesktop/zgui", branch = "gds-0.1.0", optional = true }
zgui-ui-primitives = { git = "https://github.com/GanDesktop/zgui", branch = "gds-0.1.0", optional = true }
zgui-ui-icons = { git = "https://github.com/GanDesktop/zgui", branch = "gds-0.1.0", optional = true }
zgui-image = { git = "https://github.com/GanDesktop/zgui", branch = "gds-0.1.0", optional = true }
zgui-platform-headless = { git = "https://github.com/GanDesktop/zgui", branch = "gds-0.1.0", optional = true }
zgui-render-wgpu = { git = "https://github.com/GanDesktop/zgui", branch = "gds-0.1.0", optional = true }
zgui-render-vector-vello = { git = "https://github.com/GanDesktop/zgui", branch = "gds-0.1.0", optional = true }
gds-settings-derive = { path = "macros/gds-settings-derive", optional = true }
rust-embed = { version = "8", optional = true, features = ["debug-embed"] }
unicode-segmentation = { version = "1", optional = true }
unicode-width = { version = "0.2", optional = true }

# Files application.
# The picker matches raw (possibly non-UTF-8) basenames, so globbing is done on
# `Path` values instead of hand-rolled `String` matching.
globset = { version = "0.4", optional = true }
memmap2 = { version = "0.9", optional = true }
mime_guess = { version = "2", optional = true }
roxmltree = { version = "0.21", optional = true }
xdg-mime = { version = "0.4", optional = true }
trash = { version = "5.3.0", optional = true }

# Agents application.
agent-client-protocol = { version = "=3.3.0", features = ["unstable", "unstable_protocol_v2"], optional = true }
bas = { package = "bas-client", git = "https://github.com/GanDesktop/bas", branch = "main", features = ["workspace-schema"], optional = true }
dirs = { version = "6", optional = true }
rodio = { version = "=0.21.1", optional = true, default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav", "tracing"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tonic = { version = "0.14", features = ["tls-ring"], optional = true }
vt100 = { version = "0.16", optional = true }
which = { version = "8", optional = true }

# Command-line entry points (Files, Agents and Portal).
clap = { version = "4", features = ["derive", "env"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "open_uri", "inhibit", "notification"], optional = true }
fontconfig-sys = { package = "yeslogic-fontconfig-sys", version = "6.0", optional = true }
oo7 = { version = "0.6", default-features = false, features = ["native_crypto", "tokio"], optional = true }
zbus = { version = "5.19", default-features = false, features = ["tokio"], optional = true }
rustix = { version = "1.1", features = ["fs", "event"], optional = true }

[target.'cfg(unix)'.dependencies]
# Owner/group names come from the system NSS interfaces (`getpwuid_r` /
# `getgrgid_r`); we do not parse passwd files ourselves.
nix = { version = "0.31", features = ["user", "fs", "process", "signal"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "=3.6.1", optional = true }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"], optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9" }

[dev-dependencies]
futures-lite = "2"
regex = "1"
serde_json = "1"
tempfile = "3"
zgui-platform-headless = { git = "https://github.com/GanDesktop/zgui", branch = "gds-0.1.0" }
bas = { package = "bas-client", git = "https://github.com/GanDesktop/bas", branch = "main" }
bas-server = { git = "https://github.com/GanDesktop/bas", branch = "main" }
# Runtime-generated TLS fixtures for the imported connection tests.
rcgen = "=0.13.2"
tonic-prost = "0.14"

[target.'cfg(unix)'.dev-dependencies]
# Test-only PTY helpers (`nix::pty`, `nix::unistd::tcsetpgrp`) in the Agents
# terminal tests; production code does not need nix's term feature.
nix = { version = "0.31", features = ["process", "term"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }

[profile.dev]
debug = 1

# Keep application code easy to step through while optimizing the UI runtime and its dependencies.
[profile.dev.package."*"]
opt-level = 2

# Use standard release optimization while keeping compilation parallel.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = 0
strip = "symbols"
incremental = false

[patch.crates-io]
rustix = { git = "https://github.com/GanDesktop/rustix", branch = "gds-1.1.5" }
