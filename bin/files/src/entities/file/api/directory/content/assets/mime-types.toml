# Minimal last-resort category patches for canonical MIME types that have no
# `generic-icon`, media/text top-level prefix, or parent `generic-icon` in
# `shared-mime-info`.
#
# category: text, code, document, image, audio, video, archive, executable, font, binary.

[[patches]]
category = "executable"
mimes = [
    "application/x-sharedlib",
    "application/x-pie-executable",
    "application/x-mach-binary",
    "application/wasm",
]

[[patches]]
category = "archive"
mimes = ["application/x-apple-diskimage"]
