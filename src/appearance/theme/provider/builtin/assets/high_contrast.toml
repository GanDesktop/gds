[metadata]
schema_version = 1
name = "High Contrast"

[metadata.i18n]
zh-CN = "高对比"

# 高对比 · High Contrast — black and white with distinct action and status colors
# Opaque #RRGGBB roles; surface opacity is controlled by application preferences.
# Selection surfaces also support controls that retain the normal foreground.

[light]
content = "#ffffff"
sidebar = "#f0f0f0"
foreground = "#000000"
sidebar_foreground = "#000000"
muted_foreground = "#303030"
surface = "#ffffff"
surface_foreground = "#000000"
panel = "#e5e5e5"
panel_foreground = "#000000"
border = "#000000"
outline = "#000000"
shadow = "#000000"
primary = "#0029a3"
primary_foreground = "#ffffff"
selection = "#c9dcff"
selection_foreground = "#000000"
tooltip = "#ffffff"
tooltip_foreground = "#000000"
link = "#001f9e"
error = "#9c0000"
error_foreground = "#ffffff"
success = "#005020"
success_foreground = "#ffffff"
warning = "#633c00"
warning_foreground = "#ffffff"

[dark]
content = "#000000"
sidebar = "#101010"
foreground = "#ffffff"
sidebar_foreground = "#ffffff"
muted_foreground = "#dedede"
surface = "#141414"
surface_foreground = "#ffffff"
panel = "#202020"
panel_foreground = "#ffffff"
border = "#ffffff"
outline = "#ffffff"
shadow = "#000000"
primary = "#ffef00"
primary_foreground = "#000000"
selection = "#002b55"
selection_foreground = "#ffffff"
tooltip = "#000000"
tooltip_foreground = "#ffffff"
link = "#6fffff"
error = "#ffb8b8"
error_foreground = "#000000"
success = "#80ffb0"
success_foreground = "#000000"
warning = "#ffe680"
warning_foreground = "#000000"
